# Paths included in the module backup (state/environment is always included).
#   state/passwords.env   WEBUI_SECRET_KEY and the LDAP bind password
#   state/webui.db        a consistent snapshot of the database, taken by
#                         bin/module-dump-state (the live copy in the volume is
#                         written in WAL mode and can be torn); restore-module
#                         puts it back over the volume copy
#   openwebui-data        uploads, the RAG vector store and the cache (and the
#                         live webui.db, which restore-module overwrites with
#                         the snapshot above)
state/passwords.env
state/webui.db
volumes/openwebui-data
